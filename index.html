<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Booking</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f6f9;
    padding:20px;
}

.container{
    max-width:500px;
    margin:auto;
}

.user-card,
.hotel-card{
    background:#fff;
    border-radius:20px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

.user-card{
    text-align:center;
}

.avatar{
    width:80px;
    height:80px;
    border-radius:50%;
    object-fit:cover;
    margin-bottom:10px;
}

.hotel-image{
    width:100%;
    border-radius:15px;
    margin-bottom:15px;
}

.hotel-name{
    font-size:24px;
    font-weight:bold;
}

.price{
    color:#06C755;
    font-size:22px;
    margin:10px 0;
    font-weight:bold;
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
}

button{
    width:100%;
    margin-top:20px;
    padding:15px;
    border:none;
    border-radius:12px;
    background:#06C755;
    color:white;
    font-size:18px;
    font-weight:bold;
}

.success{
    display:none;
    margin-top:15px;
    background:#e7fff0;
    color:#008a3d;
    padding:12px;
    border-radius:10px;
    text-align:center;
}
</style>
</head>

<body>

<div class="container">

<div class="user-card">
    <img id="avatar" class="avatar" src="">
    <h3 id="username">Loading...</h3>
</div>

<div class="hotel-card">
    <div class="search-box">

<h2>🔍 Search Rooms</h2>

<label>Check-in</label>
<input type="date" id="checkin">

<label>Check-out</label>
<input type="date" id="checkout">

<label>Guests</label>
<input type="number" id="guests" value="2">

<button onclick="searchRooms()">
Search Rooms
</button>

</div>

<div id="results"></div>

<script>
function searchRooms(){

const rooms = [

{
name:"Standard Room",
price:50,
available:5,
image:"https://images.unsplash.com/photo-1631049307264-da0ec9d70304?w=800"
},

{
name:"Deluxe Room",
price:80,
available:3,
image:"https://images.unsplash.com/photo-1566665797739-1674de7a421a?w=800"
},

{
name:"Suite Room",
price:120,
available:1,
image:"https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?w=800"
}

];

let html="";

rooms.forEach(room=>{

html += `
<div class="room-card">

<img src="${room.image}"
style="width:100%;border-radius:15px;">

<h3>${room.name}</h3>

<p>💲 ${room.price}/Night</p>

<p>✅ Available : ${room.available}</p>

<button onclick="bookRoom('${room.name}')">
Book Now
</button>

</div>
`;

});

document.getElementById("results").innerHTML =
html;
}
</script>

<img
class="hotel-image"
src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1200"
alt="Hotel">

<div class="hotel-name">🏨 Grand Hotel</div>

<div class="price">$80 / Night</div>

<label>Check-in Date</label>
<input type="date" id="checkin">

<label>Check-out Date</label>
<input type="date" id="checkout">

<label>Room Type</label>
<select id="room">
    <option>Standard Room</option>
    <option>Deluxe Room</option>
    <option>Suite Room</option>
</select>

<label>Guests</label>
<input type="number" id="guest" value="2">

<button onclick="bookRoom()">
Book Now
</button>

<div class="success" id="successMsg">
✅ Booking Successful
</div>

</div>

</div>

<script>

async function initLIFF() {

    try {

        await liff.init({
            liffId: "2010935853-z0nGBi5C"
        });

        if (!liff.isLoggedIn()) {
            liff.login();
            return;
        }

        const profile = await liff.getProfile();

        document.getElementById("username").innerText =
            profile.displayName;

        document.getElementById("avatar").src =
            profile.pictureUrl;

    } catch(error) {

        document.getElementById("username").innerText =
            error.message;
    }
}

function bookRoom() {

    const checkin =
        document.getElementById("checkin").value;

    const checkout =
        document.getElementById("checkout").value;

    if (!checkin || !checkout) {

        alert("Please select dates");
        return;
    }

    document.getElementById("successMsg").style.display =
        "block";

    alert(
`🏨 Booking Confirmed

Check-in: ${checkin}
Check-out: ${checkout}`
    );
}

initLIFF();

</script>

</body>
</html>
