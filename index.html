<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Hotel Booking</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#f5f7fb;
padding:15px;
}

.header{
background:#06C755;
color:white;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

.card{
background:white;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

input,select{
width:100%;
padding:12px;
margin-top:10px;
border:1px solid #ddd;
border-radius:10px;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:10px;
background:#06C755;
color:white;
font-size:16px;
margin-top:10px;
cursor:pointer;
}

.room-card{
background:white;
padding:15px;
border-radius:15px;
margin-top:12px;
box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.room-title{
font-size:18px;
font-weight:bold;
}

.price{
color:#06C755;
font-size:20px;
font-weight:bold;
margin-top:5px;
}

.booking-card{
background:white;
padding:15px;
border-radius:15px;
margin-top:12px;
border-left:5px solid #06C755;
}

</style>

</head>

<body>

<div class="header">
<h2>🏨 Hotel Booking</h2>
<div id="userName">Loading...</div>
</div>

<div class="card">

<h3>Search Room</h3>

<input type="date" id="checkIn">

<input type="date" id="checkOut">

<button onclick="searchRooms()">
Search Rooms
</button>

</div>

<div id="roomResults"></div>

<div class="card">

<button onclick="loadMyBookings()">
📖 My Bookings
</button>

</div>

<div id="bookingResults"></div>

<script>

const LIFF_ID = "YOUR_LIFF_ID";

const SEARCH_URL =
"https://sage-loon.pikapod.net/webhook/search-room";

const BOOK_URL =
"https://sage-loon.pikapod.net/webhook/Booking";

const MYBOOKING_URL =
"https://sage-loon.pikapod.net/webhook/Mybooking";

let profile=null;

async function init(){

await liff.init({
liffId:LIFF_ID
});

if(!liff.isLoggedIn()){
liff.login();
return;
}

profile = await liff.getProfile();

document.getElementById("userName").innerHTML =
"Welcome " + profile.displayName;

}

init();

async function searchRooms(){

const res = await fetch(SEARCH_URL);

const data = await res.json();

console.log(data);

const container =
document.getElementById("roomResults");

container.innerHTML="";

if(!data.rooms){
alert("No rooms found");
return;
}

data.rooms.forEach(room=>{

container.innerHTML += `

<div class="room-card">

<div class="room-title">
Room ${room.roomNo}
</div>

<div>
${room.roomType}
</div>

<div class="price">
$${room.price}/night
</div>

<button onclick="bookRoom('${room.roomNo}')">
Book Now
</button>

</div>

`;

});

}

async function bookRoom(roomNo){

const checkIn =
document.getElementById("checkIn").value;

const checkOut =
document.getElementById("checkOut").value;

if(!checkIn || !checkOut){

alert("Select dates first");

return;

}

const res = await fetch(
BOOK_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

roomNo:roomNo,

customerName:
profile.displayName,

lineUserId:
profile.userId,

phone:"",

guests:1,

checkIn:checkIn,

checkOut:checkOut

})
}
);

const data = await res.json();

console.log(data);

if(data.success===false){

alert(data.message);

return;

}

alert("Booking Success");

loadMyBookings();

}

async function loadMyBookings(){

const res = await fetch(
MYBOOKING_URL,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({

lineUserId:
profile.userId

})
}
);

const data = await res.json();

console.log(data);

const container =
document.getElementById(
"bookingResults"
);

container.innerHTML="";

const bookings =
data.bookings || data;

bookings.forEach(item=>{

container.innerHTML += `

<div class="booking-card">

<h3>
Booking ID :
${item.bookingId}
</h3>

<p>
Room :
${item.roomNo}
</p>

<p>
Check In :
${item.checkIn}
</p>

<p>
Check Out :
${item.checkOut}
</p>

<p>
Status :
${item.status}
</p>

</div>

`;

});

}

</script>

</body>
</html>
