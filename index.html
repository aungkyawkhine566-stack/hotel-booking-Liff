<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Booking</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      max-width: 500px;
      margin: auto;
    }

    h2 {
      margin-top: 0;
    }

    .room {
      padding: 15px;
      background: #f5f5f5;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
      background: #06c755;
      color: white;
    }

    .total {
      margin-top: 20px;
      padding: 15px;
      background: #f5f5f5;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="card">

  <h2>C PARK Hotel Booking</h2>

  <div class="room">
    <div><strong id="roomType">Room</strong></div>
    <div>Room No: <span id="roomNo">-</span></div>
    <div>Check-in: <span id="checkIn">-</span></div>
    <div>Check-out: <span id="checkOut">-</span></div>
    <div>Price: <span id="price">0</span> MMK / night</div>
  </div>

  <label>Customer Name *</label>
  <input id="customerName" type="text" placeholder="Enter your name">

  <label>Phone Number *</label>
  <input id="phone" type="tel" placeholder="09xxxxxxxxx">

  <label>Number of Guests *</label>
  <select id="guests">
    <option value="1">1 Guest</option>
    <option value="2">2 Guests</option>
    <option value="3">3 Guests</option>
    <option value="4">4 Guests</option>
  </select>

  <label>Special Request</label>
  <textarea id="specialRequest" rows="3"
    placeholder="Optional"></textarea>

  <div class="total">
    Total:
    <span id="total">0</span> MMK
  </div>

  <button onclick="submitBooking()">
    CONFIRM & PAY
  </button>

</div>

<script>

const LIFF_ID = "2011160557-ZKTWIJi0";

const BOOKING_WEBHOOK =
  "https://sage-loon.pikapod.net/webhook/hotel-booking";

let bookingData = {};

async function init() {

  await liff.init({
    liffId: LIFF_ID
  });

  const params = new URLSearchParams(
    window.location.search
  );

  bookingData = {
    roomId: params.get("roomId") || "",
    roomNo: params.get("roomNo") || "",
    roomType: params.get("roomType") || "",
    price: Number(params.get("price") || 0),
    checkIn: params.get("checkIn") || "",
    checkOut: params.get("checkOut") || ""
  };

  document.getElementById("roomType").textContent =
    bookingData.roomType;

  document.getElementById("roomNo").textContent =
    bookingData.roomNo;

  document.getElementById("checkIn").textContent =
    bookingData.checkIn;

  document.getElementById("checkOut").textContent =
    bookingData.checkOut;

  document.getElementById("price").textContent =
    bookingData.price.toLocaleString();

  calculateTotal();
}

function calculateTotal() {

  if (!bookingData.checkIn ||
      !bookingData.checkOut) {
    document.getElementById("total").textContent =
      "0";
    return;
  }

  const start =
    new Date(bookingData.checkIn);

  const end =
    new Date(bookingData.checkOut);

  const nights =
    Math.ceil(
      (end - start) /
      (1000 * 60 * 60 * 24)
    );

  const total =
    Math.max(nights, 0) *
    bookingData.price;

  document.getElementById("total").textContent =
    total.toLocaleString();

  bookingData.nights = Math.max(nights, 0);
  bookingData.total = total;
}

async function submitBooking() {

  const customerName =
    document.getElementById("customerName").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const guests =
    document.getElementById("guests").value;

  const specialRequest =
    document.getElementById("specialRequest").value.trim();

  if (!customerName) {
    alert("Please enter your name.");
    return;
  }

  if (!phone) {
    alert("Please enter your phone number.");
    return;
  }

  let profile = null;

  if (liff.isLoggedIn()) {
    profile = await liff.getProfile();
  }

  const payload = {

    roomId: bookingData.roomId,
    roomNo: bookingData.roomNo,
    roomType: bookingData.roomType,

    checkIn: bookingData.checkIn,
    checkOut: bookingData.checkOut,

    price: bookingData.price,
    nights: bookingData.nights,
    total: bookingData.total,

    customerName,
    phone,
    guests,
    specialRequest,

    lineUserId: profile?.userId || "",
    lineDisplayName: profile?.displayName || "",

    status: "PENDING_PAYMENT"
  };

  const response = await fetch(
    BOOKING_WEBHOOK,
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(payload)
    }
  );

  const result = await response.json();

  if (!response.ok) {
    alert("Booking failed.");
    return;
  }

  alert(
    "Booking information received.\n\n" +
    "Please continue to payment."
  );

  console.log(result);
}

init();

</script>

</body>
</html>
