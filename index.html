<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Booking</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
 *{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--primary:#2563eb;
--secondary:#4f46e5;
--success:#10b981;
--bg:#f3f6fb;
--card:#ffffff;
--text:#222;
--shadow:0 10px 30px rgba(0,0,0,.08);
}

body{
background:var(--bg);
color:var(--text);
padding-bottom:90px;
}

.page{
display:none;
animation:fade .35s;
}

.page.active{
display:block;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(12px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.header{
background:linear-gradient(135deg,#4f46e5,#2563eb);
padding:35px 20px;
border-bottom-left-radius:30px;
border-bottom-right-radius:30px;
color:white;
box-shadow:var(--shadow);
}

.header h2{
font-size:28px;
font-weight:700;
}

.header p{
margin-top:6px;
opacity:.9;
}

.container{
padding:18px;
}

.card{
background:rgba(255,255,255,.9);
backdrop-filter:blur(15px);
border-radius:22px;
padding:18px;
margin-bottom:18px;
box-shadow:var(--shadow);
}

.banner{
width:100%;
height:180px;
object-fit:cover;
border-radius:18px;
margin-top:15px;
}

.input{
width:100%;
padding:15px;
margin-top:12px;
border:none;
border-radius:14px;
background:#eef2ff;
font-size:15px;
outline:none;
}

.searchBtn{
width:100%;
margin-top:15px;
padding:15px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#2563eb,#4f46e5);
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.3s;
}

.searchBtn:active{
transform:scale(.98);
}

.roomCard{
background:white;
border-radius:20px;
overflow:hidden;
margin-bottom:18px;
box-shadow:var(--shadow);
}

.roomCard img{
width:100%;
height:190px;
object-fit:cover;
}

.roomBody{
padding:16px;
}

.roomTitle{
font-size:20px;
font-weight:700;
}

.roomPrice{
margin-top:10px;
font-size:20px;
color:var(--primary);
font-weight:bold;
}

.bookBtn{
width:100%;
margin-top:15px;
padding:14px;
border:none;
border-radius:14px;
background:var(--success);
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

.bottomNav{
position:fixed;
bottom:15px;
left:15px;
right:15px;
height:68px;
background:white;
display:flex;
justify-content:space-around;
align-items:center;
border-radius:22px;
box-shadow:0 10px 35px rgba(0,0,0,.15);
z-index:999;
}

.navItem{
flex:1;
text-align:center;
font-size:12px;
color:#666;
cursor:pointer;
transition:.3s;
}

.navItem.active{
color:var(--primary);
font-weight:700;
transform:translateY(-3px);
}

h2,h3{
margin-bottom:12px;
}

p{
line-height:1.6;
}
</style>
</head>

<body>

<!-- HOME PAGE -->
<div id="homePage" class="page active">

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <h2>🏨 Hotel Booking</h2>
            <p>Find your perfect stay</p>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">

        <!-- Welcome -->
        <section class="card">
            <h3>Welcome 👋</h3>
            <p>Book hotels quickly with LINE.</p>

            <img
                class="banner"
                src="https://images.unsplash.com/photo-1566073771259-6a8506099945?w=1200"
                alt="Hotel Banner">
        </section>

        <!-- Search -->
        <section class="card">

            <h3>🔍 Search Rooms</h3>

            <input
                id="checkin"
                class="input"
                type="date">

            <input
                id="checkout"
                class="input"
                type="date">

            <select
                id="guests"
                class="input">

                <option>1 Guest</option>
                <option>2 Guests</option>
                <option>3 Guests</option>
                <option>4 Guests</option>

            </select>

            <input
    id="customerName"
    class="input"
    type="text"
    placeholder="Customer Name">

<input
    id="phone"
    class="input"
    type="tel"
    placeholder="Phone Number">

            <button
                class="searchBtn"
                onclick="searchRooms()">

                Search Available Rooms

            </button>

        </section>

        <!-- Search Result -->
        <section id="roomsContainer">

        </section>

    </main>

</div>

<!-- BOOKINGS PAGE -->
<div id="bookingsPage" class="page">

    <main class="container">

        <div class="card">

            <h2>📖 My Bookings</h2>

            <div id="bookingList">

                <p>No bookings yet.</p>

            </div>

        </div>

    </main>

</div>

<!-- PAYMENT PAGE -->
<div id="paymentPage" class="page">

    <main class="container">

        <div class="card">

            <h2>💳 Payment</h2>

            <div id="paymentContent">

                <p>No payment pending.</p>

            </div>

        </div>

    </main>

</div>

<!-- PROFILE PAGE -->
<div id="profilePage" class="page">

    <main class="container">

        <div
            id="profileContent"
            class="card">

            <p>Loading Profile...</p>

        </div>

    </main>

</div>

<!-- BOTTOM NAVIGATION -->

<nav class="bottomNav">

    <div
        class="navItem active"
        onclick="showPage('home',this)">

        🏠<br>Home

    </div>

    <div
        class="navItem"
        onclick="showPage('bookings',this)">

        📖<br>Bookings

    </div>

    <div
        class="navItem"
        onclick="showPage('payment',this)">

        💳<br>Payment

    </div>

    <div
        class="navItem"
        onclick="showPage('profile',this)">

        👤<br>Profile

    </div>

</nav>

<!-- LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<!-- JavaScript -->
<script>

const LIFF_ID = "2010935853-z0nGBi5C";

/* ---------- Demo Rooms ---------- */
const WEBHOOK_URL =
"https://sage-loon.pikapod.net/webhook-test/search-rooms";

let rooms = [];

/* ---------- Show Rooms ---------- */
async function searchRooms(){

const checkin=document.getElementById("checkin").value;

const checkout=document.getElementById("checkout").value;

const guests=document.getElementById("guests").value;

if(!checkin || !checkout){

alert("Please select Check-in and Check-out");

return;

}

try{

const response=await fetch(WEBHOOK_URL,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

checkin,

checkout,

guests

})

});

rooms=await response.json();

showRooms();

}catch(err){

console.error(err);

alert("Cannot connect to server");

}

}
    function showRooms(){

const container=document.getElementById("roomsContainer");

container.innerHTML="";

if(rooms.length===0){

container.innerHTML=`
<div class="card">

<h3>No Available Rooms</h3>

</div>
`;

return;

}

rooms.forEach(room=>{

container.innerHTML+=`

<div class="roomCard">

<img src="${room.image}">

<div class="roomBody">

<h3 class="roomTitle">

${room.name}

</h3>

<p>${room.guests} Guests</p>

<p class="roomPrice">

$${room.price}

</p>

<button

class="bookBtn"

onclick="bookRoom(${room.id})">

Book Now

</button>

</div>

</div>

`;

});

}
/* ---------- Booking ---------- */

async function bookRoom(id){

    const room = rooms.find(r => r.id === id);

    const response = await fetch(
        "https://sage-loon.pikapod.net/webhook-test/Booking",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                roomNo: room.id,
                customerName: document.getElementById("customerName").value,
                lineUserId: profile.userId,
                phone: document.getElementById("phone").value,
                checkin: document.getElementById("checkin").value,
                checkout: document.getElementById("checkout").value,
                guests: document.getElementById("guests").value
            })
        }
    );

    const result = await response.json();

    alert(result.message);

    showPage("bookings",
    document.querySelectorAll(".navItem")[1]);

}
/* ---------- Navigation ---------- */

function showPage(page,el){

document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active");
});

document.querySelectorAll(".navItem").forEach(n=>{
n.classList.remove("active");
});

document.getElementById(page+"Page")
.classList.add("active");

if(el){
el.classList.add("active");
}

}

/* ---------- LIFF ---------- */

async function initLIFF(){

try{

await liff.init({
liffId:LIFF_ID
});

if(!liff.isLoggedIn()){

liff.login();

return;

}

const profile=await liff.getProfile();

document.getElementById("profileContent").innerHTML=`

<div style="text-align:center;">

<img
src="${profile.pictureUrl}"
style="
width:90px;
height:90px;
border-radius:50%;
">

<h2 style="margin-top:15px;">
${profile.displayName}
</h2>

<p style="font-size:12px;word-break:break-all;">
${profile.userId}
</p>

</div>

`;

}catch(e){

console.log(e);

}

}

/* ---------- Start ---------- */

searchRooms();

initLIFF();


</script>

</body>
</html>
