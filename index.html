<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hotel Booking</title><style>body{font-family:Arial;background:#f5f7fb;margin:0}.wrap{max-width:520px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:18px;margin:14px 0;box-shadow:0 6px 20px #0001}.room{padding:16px;border:1px solid #ddd;border-radius:12px;margin:10px 0;cursor:pointer}label{display:block;font-weight:bold;margin:12px 0 5px}input,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}button{width:100%;padding:13px;border:0;border-radius:10px;background:#315efb;color:white;font-weight:bold;margin-top:16px}.hidden{display:none}.err{color:#b42318}.ok{color:#137a3b}</style></head><body><div class="wrap"><div class="card"><h1>Hotel Booking</h1><p>Select a room and your stay dates.</p></div><div id="rooms" class="card"><h2>1. Select Room</h2><div class="room" onclick="pick('Standard Room')"><b>Standard Room</b><br>40,000 MMK / night</div><div class="room" onclick="pick('Superior Room')"><b>Superior Room</b><br>60,000 MMK / night</div><div class="room" onclick="pick('Deluxe Room')"><b>Deluxe Room</b><br>80,000 MMK / night</div></div><div id="form" class="card hidden"><h2>2. Dates & Details</h2><p id="chosen"></p><label>Check-in</label><input id="checkin" type="date"><label>Check-out</label><input id="checkout" type="date"><label>Full Name</label><input id="name"><label>Phone Number</label><input id="phone"><label>Guests</label><input id="guests" type="number" min="1" value="2"><label>Note</label><textarea id="note" rows="3"></textarea><button onclick="book()">Confirm Booking</button><div id="msg"></div></div><div id="result" class="card hidden"></div></div><script>const WEBHOOK_URL="PASTE_N8N_PRODUCTION_WEBHOOK_URL_HERE";let room="";function pick(r){room=r;rooms.classList.add("hidden");form.classList.remove("hidden");chosen.textContent="Selected room: "+r}async function book(){const d={action:"book",room,checkin:checkin.value,checkout:checkout.value,name:name.value.trim(),phone:phone.value.trim(),guests:guests.value,note:note.value.trim()};if(!d.checkin||!d.checkout||!d.name||!d.phone){msg.innerHTML="<p class=err>Please complete all required fields.</p>";return}if(d.checkout<=d.checkin){msg.innerHTML="<p class=err>Check-out must be after check-in.</p>";return}try{const r=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)}),x=await r.json();if(!x.success){msg.innerHTML="<p class=err>"+x.message+"</p>";return}form.classList.add("hidden");result.classList.remove("hidden");result.innerHTML="<h2 class=ok>Booking Submitted ✓</h2><p>Booking ID: "+x.booking.bookingId+"<br>Room: "+x.booking.room+"<br>Check-in: "+x.booking.checkin+"<br>Check-out: "+x.booking.checkout+"<br>Guests: "+x.booking.guests+"<br>Status: "+x.booking.status+"</p>"}catch(e){msg.innerHTML="<p class=err>Cannot connect to booking server.</p>"}}</script></body></html>
