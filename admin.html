<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Calendar</title><style>body{font-family:Arial;background:#f5f7fb;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.calendar{background:#fff;padding:18px;border-radius:16px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(7,1fr);min-width:840px;gap:1px;background:#ddd}.cell{background:white;min-height:110px;padding:8px}.head{min-height:auto;font-weight:bold;background:#eef2f8}.event{margin-top:6px;padding:7px;border-radius:8px;background:#dff5e6;font-size:12px}button{padding:10px 15px;background:#315efb;color:white;border:0;border-radius:9px}</style></head><body><div class="wrap"><h1>Admin Calendar</h1><button onclick="load()">Refresh</button><p id="status"></p><div class="calendar"><div id="cal"></div></div></div><script>const WEBHOOK_URL="https://sage-loon.pikapod.net/webhook/hotel-booking";async function load(){status.textContent="Loading...";try{const r=await fetch(WEBHOOK_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"list"})}),x=await r.json();render(x.bookings||[]);status.textContent="Updated "+new Date().toLocaleString()}catch(e){status.textContent="Cannot connect to server."}}function render(bs){const d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();let h="<h2>"+d.toLocaleString(undefined,{month:"long",year:"numeric"})+"</h2><div class=grid>";["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(x=>h+="<div class='cell head'>"+x+"</div>");for(let i=0;i<first;i++)h+="<div class=cell></div>";for(let day=1;day<=days;day++){const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(day).padStart(2,"0");h+="<div class=cell><b>"+day+"</b>";bs.filter(b=>b.checkin<=ds&&b.checkout>ds&&b.status!=="Cancelled").forEach(b=>h+="<div class=event><b>"+esc(b.room)+"</b><br>"+esc(b.name)+"<br>"+b.checkin+" → "+b.checkout+"</div>");h+="</div>"}cal.innerHTML=h+"</div>"}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}load()</script></body></html>
